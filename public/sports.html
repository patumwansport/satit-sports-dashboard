<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ชนิดกีฬา — กีฬาสาธิตสามัคคี</title>
  <meta name="description" content="ชนิดกีฬาที่ส่งแข่งขันทั้งหมดในกีฬาสาธิตสามัคคี พร้อมสถานะการแข่งขันของแต่ละกีฬา" />
  <link rel="stylesheet" href="css/app.css" />
  <!-- เปิดการเชื่อมต่อไป Google Sheets ไว้ก่อนระหว่างที่สคริปต์ยังโหลดอยู่ (ประหยัด DNS + TLS ของคำขอแรก)
       crossorigin เพราะ fetch ข้ามโดเมนไม่ส่งคุกกี้ ต้องเป็นการเชื่อมต่อแบบเดียวกันถึงจะหยิบไปใช้ได้ -->
  <link rel="preconnect" href="https://docs.google.com" crossorigin />
  <!-- โมดูลที่ถูก import ต่อกันเป็นทอด ๆ: สั่งโหลดพร้อมกันเลย ไม่ต้องรอ import ทีละชั้น -->
  <link rel="modulepreload" href="js/common.js" />
  <link rel="modulepreload" href="js/sheets.js" />
  <link rel="modulepreload" href="js/format.js" />
  <link rel="modulepreload" href="js/config.js" />
</head>
<body class="min-h-screen bg-paper font-body leading-[1.6] tracking-[.01em] text-fg antialiased selection:bg-brand-100 selection:text-brand-strong">
  <a class="absolute top-0 -left-[999px] z-[100] rounded-br-[8px] bg-ink px-4 py-2.5 text-on-ink focus:left-0" href="#main">ข้ามไปยังเนื้อหาหลัก</a>

  <div class="group grid min-h-screen grid-cols-[252px_1fr] max-[860px]:grid-cols-1" id="app">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sticky top-0 z-40 flex h-screen flex-col border-r border-line bg-rail max-[860px]:fixed max-[860px]:top-0 max-[860px]:left-0 max-[860px]:w-[252px] max-[860px]:-translate-x-full max-[860px]:shadow-card max-[860px]:transition-transform max-[860px]:duration-[220ms] max-[860px]:group-data-[side=open]:translate-x-0 motion-reduce:transition-none" id="sidebar" aria-label="เมนูหลัก">
      <div class="px-[22px] pt-5 pb-4">
        <img class="block h-auto w-full dark:hidden" src="assets/logo/satitpatumwan.png" alt="โรงเรียนสาธิตมหาวิทยาลัยศรีนครินทรวิโรฒ ปทุมวัน" width="776" height="214" decoding="async" />
        <!-- โหมดมืดใช้โลโก้ฉบับขาวพื้นโปร่ง ไม่ใช่โลโก้สีวางบนกล่องขาวเหมือนเดิม
             สองไฟล์สัดส่วนเท่ากัน (3.63) สลับธีมแล้วเลย์เอาต์จึงไม่ขยับ -->
        <img class="hidden h-auto w-full dark:block" src="assets/logo/satitpatumwan-dark.webp" alt="โรงเรียนสาธิตมหาวิทยาลัยศรีนครินทรวิโรฒ ปทุมวัน" width="537" height="148" decoding="async" />
      </div>
      <nav class="flex flex-1 flex-col gap-[3px] overflow-y-auto px-3.5 py-2.5" aria-label="นำทางแดชบอร์ด">
        <a class="group/nav flex items-center gap-3 rounded-md px-3.5 py-[11px] text-[13.5px] text-fg-soft no-underline transition-[background-color,color] duration-150 hover:bg-surface-soft hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand aria-[current=page]:bg-brand aria-[current=page]:text-on-ink aria-[current=page]:shadow-card motion-reduce:transition-none" href="index.html" data-page="home"><i class="icon-mask size-[18px] opacity-80 group-aria-[current=page]/nav:opacity-100" data-ic="dashboard"></i><span>หน้าหลัก</span></a>
        <a class="group/nav flex items-center gap-3 rounded-md px-3.5 py-[11px] text-[13.5px] text-fg-soft no-underline transition-[background-color,color] duration-150 hover:bg-surface-soft hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand aria-[current=page]:bg-brand aria-[current=page]:text-on-ink aria-[current=page]:shadow-card motion-reduce:transition-none" href="schedule.html" data-page="schedule"><i class="icon-mask size-[18px] opacity-80 group-aria-[current=page]/nav:opacity-100" data-ic="calendar"></i><span>ตารางการแข่งขัน</span></a>
        <a class="group/nav flex items-center gap-3 rounded-md px-3.5 py-[11px] text-[13.5px] text-fg-soft no-underline transition-[background-color,color] duration-150 hover:bg-surface-soft hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand aria-[current=page]:bg-brand aria-[current=page]:text-on-ink aria-[current=page]:shadow-card motion-reduce:transition-none" href="matches.html" data-page="matches"><i class="icon-mask size-[18px] opacity-80 group-aria-[current=page]/nav:opacity-100" data-ic="results"></i><span>ผลการแข่งขัน</span></a>
        <a class="group/nav flex items-center gap-3 rounded-md px-3.5 py-[11px] text-[13.5px] text-fg-soft no-underline transition-[background-color,color] duration-150 hover:bg-surface-soft hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand aria-[current=page]:bg-brand aria-[current=page]:text-on-ink aria-[current=page]:shadow-card motion-reduce:transition-none" href="medals.html" data-page="medals"><i class="icon-mask size-[18px] opacity-80 group-aria-[current=page]/nav:opacity-100" data-ic="medal"></i><span>อันดับเหรียญรางวัล</span></a>
        <a class="group/nav flex items-center gap-3 rounded-md px-3.5 py-[11px] text-[13.5px] text-fg-soft no-underline transition-[background-color,color] duration-150 hover:bg-surface-soft hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand aria-[current=page]:bg-brand aria-[current=page]:text-on-ink aria-[current=page]:shadow-card motion-reduce:transition-none" href="sports.html" data-page="sports"><i class="icon-mask size-[18px] opacity-80 group-aria-[current=page]/nav:opacity-100" data-ic="sports"></i><span>ชนิดกีฬา</span></a>
      </nav>
    </aside>
    <div class="fixed inset-0 z-[39] border-0 bg-[oklch(24%_0.03_260/.45)]" id="scrim" hidden></div>

    <!-- ===================== MAIN ===================== -->
    <div class="flex min-w-0 flex-col">
      <header class="sticky top-0 z-30 flex items-center gap-3.5 border-b border-line bg-paper/85 px-[26px] py-4 backdrop-blur-[14px]">
        <button class="btn btn-outline btn-icon relative size-[38px] rounded-[11px] text-fg-soft hover:text-fg hidden max-[860px]:inline-flex" id="menuBtn" type="button" aria-label="เปิด/ปิดเมนู"><i class="icon-mask size-[19px]" data-ic="menu"></i></button>
        <div class="flex-1"></div>
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-2 text-[12.5px] whitespace-nowrap text-fg-soft" role="status" aria-live="polite">
            <span class="size-[7px] flex-none rounded-full bg-done motion-safe:animate-sync-pulse" aria-hidden="true"></span>
            <span class="max-[560px]:hidden">อัปเดตเมื่อ </span><span class="hidden max-[560px]:inline">อัปเดต </span><b class="font-normal tabular-nums" id="syncTime">—</b><span class="max-[560px]:hidden"> วินาทีที่แล้ว</span><span class="hidden max-[560px]:inline"> วิ</span>
          </span>
          <button class="btn btn-outline btn-icon relative size-[38px] rounded-[11px] text-fg-soft hover:text-fg" id="liveBell" type="button" aria-label="รายการที่กำลังแข่งสด">
            <i class="icon-mask size-[19px]" data-ic="live"></i>
            <span class="absolute -top-1 -right-1 flex h-[17px] min-w-[17px] items-center justify-center rounded-full bg-live px-1 font-mono text-[10px] text-on-ink" id="liveBadge" hidden>0</span>
          </button>
          <button class="btn btn-outline btn-icon relative size-[38px] rounded-[11px] text-fg-soft hover:text-fg" id="themeToggle" type="button" aria-label="สลับโหมดสว่าง/มืด">
            <svg class="block dark:hidden" viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <svg class="hidden dark:block" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M20 14.5A8 8 0 019.5 4a7 7 0 108.9 8.9 8 8 0 011.6 1.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <main id="main" class="mx-auto flex w-full max-w-[1600px] flex-col gap-7 px-8 pt-8 pb-14 max-[560px]:px-3.5 max-[560px]:pt-4 max-[560px]:pb-10">
        <div>
          <h1 class="m-0 font-display text-[25px] font-normal text-brand-strong">ชนิดกีฬาที่ส่งแข่ง</h1>
          <p class="mt-1.5 text-[13.5px] text-fg-soft" id="sportsCount"></p>
        </div>

        <!-- การ์ดชนิดกีฬา: ที่ 190px คอลัมน์เดียวเต็มจอบนมือถือ การ์ดใบเดียวสูงเกือบ 300px
             14 ชนิดกลายเป็นการเลื่อนยาวมาก — ลดขั้นต่ำให้ได้ 2 คอลัมน์บนจอ 360px ขึ้นไป -->
        <div class="grid grid-cols-[repeat(auto-fill,minmax(190px,1fr))] gap-4 max-[560px]:grid-cols-[repeat(auto-fill,minmax(140px,1fr))] max-[560px]:gap-3" id="sportGrid"></div>

        <footer class="flex items-center justify-between gap-3 pt-1 text-[12px] text-fg-mute max-[560px]:flex-col max-[560px]:items-start">
          <span>ข้อมูลเชื่อมต่อจาก Google Sheets ของฝ่ายจัดการแข่งขัน · ผลอัปเดตทันทีเมื่อกรรมการบันทึกคะแนน</span>
          <span id="metaEdition"></span>
        </footer>
      </main>
    </div>
  </div>

  <!-- ป๊อปอัปรายละเอียดกีฬา — เนื้อหาข้างในวาดจาก js/sports.js ทุกครั้งที่เปิด
       ใช้ <dialog> ของเบราว์เซอร์: ได้ปิดด้วย Esc, กันโฟกัสหลุดออกนอกกล่อง และฉากหลังมาให้เอง
       ตัว <dialog> เป็นแค่กรอบใส (คลิกโดนตรงไหนที่ไม่ใช่การ์ด = คลิกฉากหลัง จึงปิดได้)
       m-auto ต้องมี: preflight ของ Tailwind ล้าง margin ของทุก element ทิ้ง กล่องจึงไปกองมุมซ้ายบนแทนที่จะอยู่กลางจอ
       การ์ดจริงคือ div ข้างใน ซึ่งถูกสร้างใหม่ทุกครั้งที่เปิด อนิเมชันเด้งเข้าจึงเล่นซ้ำได้ -->
  <dialog class="m-auto w-[min(360px,calc(100vw-28px))] max-w-none border-0 bg-transparent p-0 text-fg backdrop:bg-[oklch(24%_0.03_260/.5)]" id="sportModal" aria-labelledby="sportModalTitle"></dialog>

  <script type="module" src="js/sports.js"></script>
</body>
</html>
