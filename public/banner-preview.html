  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตัวอย่างแบนเนอร์โปรแกรมการแข่งขัน</title>
  <link rel="stylesheet" href="css/app.css?v=ff5cc79bcd" />
</head>
<body class="bg-surface-soft font-body text-fg" style="padding:24px">
  <main>
    <h1 style="font-size:24px;margin-bottom:8px">ตัวอย่างแบนเนอร์โปรแกรมการแข่งขัน</h1>
    <p style="margin-bottom:20px">จำลองเวลาไทยและสถานะเพื่อตรวจหน้าตาเท่านั้น ไม่บันทึกข้อมูลลง CMS</p>
    <form id="previewControls" style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:24px">
      <label>วันและเวลาไทย <input id="previewTime" type="datetime-local" value="2026-10-24T11:59" required style="background:white;border:1px solid #cbd0df;border-radius:8px;padding:10px" /></label>
      <label>สถานะของวันที่บนป้าย <select id="previewStatus" style="background:white;border:1px solid #cbd0df;border-radius:8px;padding:10px"><option value="pending">ยังไม่เป็นทางการ</option><option value="final">Final</option></select></label>
      <button type="button" id="previewNoon" style="background:#25255d;color:white;border-radius:999px;padding:12px 20px">จำลองเวลา 12:01 น.</button>
    </form>
    <div id="previewBanner"></div>
    <p id="previewMessage" role="status" style="margin-top:16px"></p>
  </main>
  <script type="module">
    import { programDateAt, programDateLabel, programTitleAt } from './js/program-settings.js';
    import { paintUiIcons } from './js/common.js';
    import { dayFolder, driveFolderUrl } from './js/day-files.js';
    const get = id => document.getElementById(id);
    // ใช้ HTML/CSS ของแบนเนอร์จริง เพื่อให้ตัวอย่างตามหน้าแรกเสมอ
    const response = await fetch('./index.html', { cache: 'no-store' });
    const page = new DOMParser().parseFromString(await response.text(), 'text/html');
    get('previewBanner').append(page.getElementById('nextBand'));
    get('nextBand').hidden = false;
    paintUiIcons(get('nextBand'));
    let revision = 0, lastIso;
    async function render() {
      if (!get('previewTime').value || !get('previewTime').validity.valid) return;
      const now = new Date(get('previewTime').value + ':00+07:00');
      const iso = programDateAt(now);
      get('nextTitle').textContent = programTitleAt(now);
      if (lastIso && iso !== lastIso) get('previewStatus').value = 'pending';
      lastIso = iso;
      const token = ++revision;
      get('nextDate').textContent = programDateLabel(iso);
      get('nextDate').dateTime = iso;
      const final = get('previewStatus').value === 'final';
      get('nextStatus').dataset.status = final ? 'final' : 'pending';
      get('nextStatus').textContent = final ? 'Final' : 'ยังไม่เป็นทางการ';
      get('nextStatus').hidden = false;
      get('nextDl').removeAttribute('href');
      get('nextDl').setAttribute('aria-disabled', 'true');
      get('nextLinkCaption').textContent = 'กำลังโหลดโปรแกรม…';
      get('previewMessage').textContent = 'วันที่บนแบนเนอร์และลิงก์เป้าหมาย: ' + programDateLabel(iso);
      try {
        const folder = await dayFolder(iso, true);
        if (token !== revision) return;
        if (folder) {
          get('nextDl').href = driveFolderUrl(folder.id);
          get('nextDl').removeAttribute('aria-disabled');
        }
        get('nextLinkCaption').textContent = folder ? 'คลิกเพื่อดูรายละเอียด' : 'กำลังเตรียมโปรแกรม';
      } catch {
        if (token === revision) get('nextLinkCaption').textContent = 'โหลดไม่สำเร็จ กำลังลองใหม่';
      }
    }
    get('previewControls').addEventListener('submit', e => e.preventDefault());
    get('previewTime').addEventListener('change', render);
    get('previewStatus').addEventListener('change', render);
    get('previewNoon').addEventListener('click', () => {
      get('previewTime').value = get('previewTime').value.slice(0, 10) + 'T12:01';
      render();
    });
    render();
  </script>
</body>
</html>
